name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  model-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: TaxonomyGate
        run: ./gradlew :core:testDebugUnitTest --tests "com.example.shoppingassistant.core.data.catalog.TaxonomyGateTest"

      - name: FacetSchemaGate
        run: ./gradlew :core:testDebugUnitTest --tests "com.example.shoppingassistant.core.data.catalog.FacetSchemaGateTest"

      - name: CatalogModelQualityGate
        run: >
          ./gradlew :domain:test
          --tests "com.example.shoppingassistant.domain.catalog.CatalogModelQualityGateTest"
          --tests "com.example.shoppingassistant.domain.catalog.Stage3TopPresetsGateTest"
          --tests "com.example.shoppingassistant.domain.catalog.CatalogGovernanceGateTest"

      - name: WizardRequiredIfGate
        run: >
          ./gradlew :feature:testDebugUnitTest
          --tests "com.example.shoppingassistant.feature.pages.trackeditems.TrackTargetWizardRequiredIfRulesTest"

  server-integration:
    runs-on: ubuntu-latest
    needs: model-gate
    env:
      SERVER_IT_STRICT: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Server Catalog Integration Tests
        run: ./gradlew :server:test --tests "com.example.shoppingassistant.server.catalog.CatalogRepositoryImplIntegrationTest"

      - name: Server Catalog/Tracks Contract Tests
        run: >
          ./gradlew :server:test
          --tests "com.example.shoppingassistant.server.contracts.CatalogTracksContractIntegrationTest"

  build:
    runs-on: ubuntu-latest
    needs: [model-gate, server-integration]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
