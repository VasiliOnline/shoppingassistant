version: 2.1-L0
l0_code: FASH
locale: ru-RU
normalization:
  lowercase: true
  replace_yo: true
  strip_punct: true
  collapse_spaces: true
  tokenize: whitespace+basic_punct
blocked_noise_tokens:
- выкройка
- выкройки
- как сшить
- как связать
- схема вязания
- мастер класс
- мк
- крючком
- спицами
- скачать
- игра
- обои
- инструкция
- ремонт
- переделка
disambiguation_ordered_rules:
- id: R.FASH_ACCESSORIES_BAG_ROUTE_OUT
  if_any_tokens:
  - кошелек
  - кошелёк
  - кардхолдер
  - визитница
  - косметичк
  then_route_canonical: FASH.BAGS
  confidence: 0.94
  notes: FASH.ACCESSORIES v1.0 route-out; wallets, cardholders and cosmetic bags belong to FASH.BAGS.
- id: R.FASH_ACCESSORIES_SMART_WEARABLE_ROUTE_OUT
  if_any_tokens:
  - apple watch
  - galaxy watch
  - smartwatch
  - smart watch
  - mi band
  - фитнес браслет
  - смарт часы
  and_any_tokens:
  - ремешок
  - браслет
  - strap
  - часы
  - watch
  then_route_canonical: TECH.WEARABLES
  confidence: 0.93
  notes: FASH.ACCESSORIES v1.0 route-out; smart watches and smart straps belong to TECH.WEARABLES route.
- id: R.FASH_ACCESSORIES_PHONE_ACCESSORY_ROUTE_OUT
  if_any_tokens:
  - чехол
  - ремешок
  - strap
  and_any_tokens:
  - телефон
  - смартфон
  - iphone
  - samsung
  - android
  then_route_canonical: TECH.PHONE_ACCESSORIES
  confidence: 0.9
  notes: FASH.ACCESSORIES v1.0 route-out; phone cases/straps are TECH.PHONE_ACCESSORIES.
- id: R.FASH_ACCESSORIES_SAFETY_EYEWEAR_ROUTE_OUT
  if_any_tokens:
  - очки
  and_any_tokens:
  - защитн
  - строительн
  - сварочн
  then_route_canonical: HOME.REPAIR_TOOLS
  confidence: 0.82
  notes: FASH.ACCESSORIES v1.0 route-out; protective eyewear is not fashion accessories in the current taxonomy.
- id: R.FASH_KIDS_APPAREL_HEAD_NOUN
  if_any_tokens:
  - одежд
  - плать
  - джинс
  - колготк
  - футболк
  - куртк
  - брюки
  - худи
  - рубашк
  and_any_tokens:
  - детск
  - для мальчик
  - для мальчика
  - для девочк
  - для девочки
  - мальчик
  - девочк
  - для ребенка
  - для ребёнка
  then_route_canonical: FASH.KIDS
  confidence: 0.94
  notes: Kids apparel head nouns must beat generic women/men and bag attribute aliases.
- id: R.FASH_BAGS_REPLICA_POLICY_REVIEW
  if_any_tokens:
  - копия
  - реплика
  - не оригинал
  - counterfeit
  - люкс копия
  and_any_tokens:
  - сумк
  - рюкзак
  - кошелек
  - кошелёк
  - gucci
  - louis vuitton
  then_route_canonical: POLICY_REVIEW
  confidence: 0.95
  notes: FASH.BAGS production guard; counterfeit and replica signals require policy review.
- id: R.FASH_BAGS_TECH_WEARABLES
  if_any_tokens:
  - apple watch
  - galaxy watch
  - smartwatch
  - смарт часы
  - фитнес браслет
  - mi band
  then_route_canonical: TECH.WEARABLES
  confidence: 0.93
  notes: Smart wearables are TECH in the current catalog, not FASH bags/accessories.
- id: R.FASH_BAGS_PHONE_CASE
  if_any_tokens:
  - чехол
  - case
  and_any_tokens:
  - телефон
  - iphone
  - айфон
  - samsung
  - galaxy
  then_route_canonical: TECH.PHONE_ACCESSORIES
  confidence: 0.93
  notes: Phone cases are TECH.PHONE_ACCESSORIES, not FASH.BAGS.
- id: R.FASH_BAGS_LAPTOP_CONTAINER
  if_any_tokens:
  - сумк
  - рюкзак
  - чехол
  - sleeve
  - папка
  and_any_tokens:
  - ноутбук
  - laptop
  - macbook
  then_route_canonical: FASH.BAGS
  confidence: 0.93
  notes: Laptop bags and laptop sleeves stay in FASH.BAGS when carrying-container intent is explicit.
- id: R.FASH_BAGS_SHOE_DRAWSTRING
  if_any_tokens:
  - мешок для обуви
  - мешок
  - gym sack
  - drawstring
  and_any_tokens:
  - обув
  - школьн
  then_route_canonical: FASH.BAGS
  confidence: 0.91
  notes: Shoe drawstring bags are bags despite the shoe token.
- id: R.FASH_BAGS_DIAPER_STROLLER_BAG
  if_any_tokens:
  - сумка для мамы
  - сумка для коляски
  - сумка для подгузников
  - diaper bag
  then_route_canonical: FASH.BAGS
  confidence: 0.92
  notes: Diaper/stroller bags are FASH.BAGS even when stroller tokens are present.
- id: R.FASH_BAGS_PET_CARRIER
  if_any_tokens:
  - сумка переноска
  - переноска
  - pet carrier
  and_any_tokens:
  - кошк
  - собак
  - животн
  then_route_canonical: PETS.ACCESSORIES
  confidence: 0.93
  notes: Pet carriers are PETS.ACCESSORIES, not fashion bags.
- id: R.FASH_BAGS_COOLER_BAG
  if_any_tokens:
  - сумка холодильник
  - термосумка
  - cooler bag
  then_route_canonical: SPORT.OUTDOOR
  confidence: 0.9
  notes: Cooler bags route outside FASH.BAGS.
- id: R.FASH_BAGS_TOOL_BAG
  if_any_tokens:
  - сумка для инструментов
  - инструментальная сумка
  - tool bag
  then_route_canonical: HOME.REPAIR_TOOLS
  confidence: 0.92
  notes: Tool bags route to repair tools.
- id: R.FASH_BAGS_MEDICAL_BAG
  if_any_tokens:
  - медицинская сумка
  - аптечка
  - первой помощи
  then_route_canonical: BEAUTY.HEALTH
  confidence: 0.88
  notes: Medical first-aid bags are not fashion bags in the current catalog.
- id: R.FASH_BAGS_CAMERA_BAG
  if_any_tokens:
  - сумка для камеры
  - фоторюкзак
  - camera bag
  then_route_canonical: TECH.CAMERAS_DRONES
  confidence: 0.9
  notes: Camera bags route to TECH.CAMERAS_DRONES unless fashion bag intent dominates.
- id: R.FASH_BAGS_HOUSEHOLD_BAGS
  if_any_tokens:
  - мешки для мусора
  - пакеты фасовочные
  then_route_canonical: HOME.CLEANING
  confidence: 0.88
  notes: Disposable household bags are not FASH.BAGS.
- id: R.FASH_KIDS_SHOES
  if_any_tokens:
  - обув
  - кроссовк
  - кед
  - ботинк
  - сапог
  - сандал
  - туфл
  and_any_tokens:
  - детск
  - для мальчик
  - для мальчика
  - для девочк
  - для девочки
  - мальчик
  - девочк
  - для ребенка
  - для ребёнка
  then_route_canonical: FASH.SHOES
  confidence: 0.92
  notes: FASH.KIDS child override guard; kids footwear belongs to FASH.SHOES
- id: R.FASH_KIDS_BAGS
  if_any_tokens:
  - рюкзак
  - сумк
  - портфель
  and_any_tokens:
  - детск
  - школьн
  - для мальчик
  - для мальчика
  - для девочк
  - для девочки
  - мальчик
  - девочк
  - для ребенка
  - для ребёнка
  then_route_canonical: FASH.BAGS
  confidence: 0.9
  notes: FASH.KIDS child override guard; kids bags/backpacks belong to FASH.BAGS
- id: R.FASH_KIDS_ACCESSORIES
  if_any_tokens:
  - ремень
  - часы
  - очки
  - украшен
  - браслет
  and_any_tokens:
  - детск
  - для мальчик
  - для девочк
  - мальчик
  - девочк
  - для ребенка
  - для ребёнка
  then_route_canonical: FASH.ACCESSORIES
  confidence: 0.88
  notes: FASH.KIDS child override guard; kids accessories stay out of apparel
- id: R.FASH_KIDS_BABY_APPAREL
  if_any_tokens:
  - боди
  - бодик
  - ползунк
  - песочник
  - распашонк
  then_route_canonical: FASH.KIDS
  confidence: 0.9
  notes: Baby apparel belongs to FASH.KIDS, not KIDS.BABY_GEAR
- id: R.KIDS_GEAR_STROLLERS
  if_any_tokens:
  - коляск
  - автокресл
  - люлька
  - база isofix
  - isofix
  then_route_canonical: KIDS.STROLLERS_CARSEATS
  confidence: 0.92
  notes: Strollers/carseats are KIDS gear, not clothing
- id: R.KIDS_GEAR_BABY
  if_any_tokens:
  - подгузник
  - пеленк
  - бутылочк
  - соска
  - пустышк
  - слинг
  - кокон
  then_route_canonical: KIDS.BABY_GEAR
  confidence: 0.9
  notes: Baby care items -> KIDS.BABY_GEAR
- id: R.KIDS_TOYS
  if_any_tokens:
  - игрушк
  - lego
  - лего
  - конструктор
  - настольная игра
  - пазл
  then_route_canonical: KIDS.TOYS_GAMES
  confidence: 0.88
  notes: Toys/games -> KIDS.TOYS_GAMES
- id: R.BEAUTY_FRAGRANCE
  if_any_tokens:
  - духи
  - парфюм
  - туалетная вода
  - одеколон
  - edp
  - edt
  then_route_canonical: BEAUTY.FRAGRANCE
  confidence: 0.93
  notes: Perfume -> Beauty
- id: R.TECH_WEARABLES
  if_any_tokens:
  - apple watch
  - smartwatch
  - смарт
  - фитнес браслет
  - fitbit
  - garmin
  - mi band
  and_any_tokens:
  - часы
  - браслет
  - трекер
  then_route_canonical: TECH.WEARABLES
  confidence: 0.9
  notes: Wearables -> TECH.WEARABLES
- id: R.HOME_HOUSEHOLD_GLOVES
  if_any_tokens:
  - перчатк
  and_any_tokens:
  - хозяйствен
  - для уборки
  - для мытья посуды
  - латекс
  - нитрил
  then_route_canonical: HOME.CLEANING
  confidence: 0.82
  notes: Household gloves are HOME.CLEANING
- id: R.SPORT_BIKES_SCOOTERS
  if_any_tokens:
  - велосипед
  - самокат
  then_route_canonical: SPORT.BIKES_SCOOTERS
  confidence: 0.8
  notes: Bikes/scooters -> SPORT.BIKES_SCOOTERS
- id: R.SPORT_FITNESS
  if_any_tokens:
  - гантели
  - штанга
  then_route_canonical: SPORT.FITNESS
  confidence: 0.8
  notes: Fitness weights -> SPORT.FITNESS
- id: R.SPORT_OUTDOOR
  if_any_tokens:
  - палатка
  - спальник
  - рюкзак турист
  - каремат
  then_route_canonical: SPORT.OUTDOOR
  confidence: 0.8
  notes: Camping/outdoor gear -> SPORT.OUTDOOR
- id: R.APPL_SEWING_MACHINE
  if_any_tokens:
  - швейная машинка
  - швейн
  and_any_tokens:
  - машин
  then_route_canonical: APPL.SMALL
  confidence: 0.72
  notes: Sewing machine is treated as APPL.SMALL in this package
- id: R.BAG_VS_LAPTOP
  if_any_tokens:
  - ноутбук
  - macbook
  - thinkpad
  - lenovo
  - asus
  - hp
  - dell
  and_none_tokens:
  - сумк
  - рюкзак
  - чехол
  - портфель
  - кейс
  then_route_canonical: TECH.COMPUTERS
  confidence: 0.74
  notes: If it's laptop without bag tokens -> TECH.COMPUTERS
scoring:
  alias_match_weight: 1.0
  token_overlap_weight: 0.7
  exact_phrase_bonus: 0.4
  leaf_preference_bonus: 0.2
  min_confidence_to_route: 0.55
fallback:
  default_browse_node: BN.FASH
  default_canonical: FASH
  if_only_generic_tokens_route_to_root: true
