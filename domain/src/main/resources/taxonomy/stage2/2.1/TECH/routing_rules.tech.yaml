  penalty_other: 25
- pattern: \b(пульт\s?(?:для\s?)?(?:тв|телевизор[\p{L}\p{N}_]*)|кронштейн\s?для\s?(?:тв|телевизор[\p{L}\p{N}_]*)|крепление\s?для\s?тв|экран\s?для\s?проектора|проекционный\s?экран|av\s?ресивер|ав\s?ресивер|ресивер\s?домашн[\p{L}\p{N}_]*\s?кинотеатр|blu\s?ray|dvd\s?плеер|apple\s?tv|chromecast|shield\s?tv|tv\s?box|тв\s?бокс|андроид\s?приставка)\b
  prefer: TECH.TV_HOME_THEATER
