schema_version: 1
l0_code: TECH
normalization:
  locale_default: ru-RU
  rules:
  - lowercase
  - trim
  - collapse_spaces
  - yo_to_e
  - strip_punct
  - hyphen_to_space
scoring:
  accept_threshold: 70
  top1_top2_gap: 10
  alias_priority_weight: 1.0
  trigger_bonus_max: 25
  conflict_penalty_max: 25
  fuzzy:
    enabled: true
    max_levenshtein: 1
    min_token_len: 5
priority_buckets:
  P0_strong:
    priority: 90
    examples:
    - смартфон
    - ноутбук
    - монитор
    - наушники
  P1_brand_model:
    priority: 80
  P2_generic:
    priority: 65
  P3_broad_group:
    priority: 55
