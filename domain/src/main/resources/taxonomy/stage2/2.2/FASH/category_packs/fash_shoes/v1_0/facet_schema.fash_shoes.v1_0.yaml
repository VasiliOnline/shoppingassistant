facet_quality_rules:
- id: DO_NOT_SHOW_EMPTY_TYPE_FACET
  rule: hide type-specific facet if no indexed offers have value in current result set
- id: SIZE_FIRST_FOR_SHOES
  rule: size facet must remain in top 3 positions for FASH.SHOES
- id: PRICE_GLOBAL
  rule: price is generic offer field, not category attribute; still visible globally
- id: MODEL_TEXT_SEARCH_ONLY
  rule: model_name_text may be searchable and shown as chip, but not a controlled facet in v1.0
