id: quality_gates.fash_shoes.v1_0
categoryCode: FASH.SHOES
version: 1.0.0
status: production_candidate
gates:
- gate_id: SCHEMA_INTEGRITY
  severity: blocker
  checks:
  - all_attributes_unique
  - all_enum_refs_exist
  - all_conditional_rule_fields_exist
  - all_type_specific_facets_valid
  pass_condition: 100_percent
- gate_id: ROUTING_GUARDS
  severity: blocker
  checks:
  - shoe_positive_queries_route_to_FASH.SHOES
  - apparel_negative_queries_not_FASH.SHOES
  - bag_negative_queries_not_FASH.SHOES
  - smartwatch_queries_route_to_TECH
  pass_condition: '>=98_percent_on_golden_queries'
- gate_id: SIZE_POLICY
  severity: blocker
  checks:
  - size_required_or_raw_size_text
  - no_visual_size_inference
  - adult_kids_range_warnings
  - no_forced_us_uk_conversion
  pass_condition: 100_percent_policy_rules_present
- gate_id: USER_SURFACE
  severity: major
  checks:
  - global_facets_include_size_brand_condition_price
  - type_specific_forms_defined_for_P0_types
  - hidden_compliance_fields_not_visible
  pass_condition: 100_percent
- gate_id: ALIASES_RU
  severity: major
  checks:
  - all_P0_shoe_types_have_ru_aliases
  - negative_route_aliases_present
  - brand_seed_present
  pass_condition: '>=95_percent_coverage'
- gate_id: VISION_SAFETY
  severity: major
  checks:
  - gender_not_inferred_from_color
  - size_not_inferred_from_unreadable_image
  - brand_only_if_readable
  - condition_confidence_rules_present
  pass_condition: 100_percent
- gate_id: COMPLIANCE
  severity: blocker
  checks:
  - counterfeit_keywords_review_or_reject
  - single_shoe_listing_explicit_only
  pass_condition: 100_percent
acceptance_thresholds:
  golden_query_route_accuracy_min: 0.98
  positive_shoes_recall_min: 0.98
  negative_guard_precision_min: 0.99
  attribute_enum_validation: 1.0
  checksum_present_for_all_release_files: 1.0
known_non_goals_v1_0:
- curated sneaker model graph
- brand-specific size conversion tables
- full authenticity verification
- automatic conversion from foot_length_cm to EU size
release_decision: PASS_IF_VALIDATION_REPORT_ALL_PASS
