- child_height_cm
copy_rules_ru:
- В UI писать “Размер” единым блоком, но в данных хранить size_eu/raw_size_text.
- Для детской обуви показывать длину стопы/стельки как подсказку, не заменяющую размер.
- Не показывать пользователю target_gender, если он был предположен с низкой уверенностью.
