version: '1.0'
categoryCode: FASH.MEN
pack_type: child_override_pack
extends: FASH.APPAREL_COMMON
public_category: true
defaults:
  target_gender:
    default: MEN
    allowed:
    - MEN
    - UNISEX
    hidden_in_user_form: true
    can_show_as_secondary_filter: true
  age_group:
    default: ADULT
    allowed:
    - ADULT
    - TEEN
    hidden_in_user_form: true
    can_show_as_secondary_filter: false
  size_system:
    default: INT
    preferred_order:
    - INT
    - RU
    - EU
    - JEANS_WL
    - ONE_SIZE
  condition:
    default_for_new_listing: null
    required: true
  locale: ru-RU
inheritance:
  attributes: inherit_all_from_FASH.APPAREL_COMMON
  values: inherit_all_from_FASH.APPAREL_COMMON_with_child_allowed_blocked_overrides
  aliases: inherit_common_aliases_plus_child_aliases
  facets: inherit_common_facets_plus_child_priority_overrides
  user_surface: inherit_common_surface_plus_child_group_overrides
  size_policy: inherit_common_size_policy_plus_men_size_priority
do_not_duplicate_common_attributes: true
child_specific_behavior:
  generic_apparel_without_gender: route_candidate_not_final_if_no_context
  male_gender_text: boost_FASH.MEN
  unisex_text: allow_UNISEX_with_lower_route_confidence_if_no_male_context
  female_or_kids_text: route_to_other_child_or_ambiguous_not_FASH.MEN
