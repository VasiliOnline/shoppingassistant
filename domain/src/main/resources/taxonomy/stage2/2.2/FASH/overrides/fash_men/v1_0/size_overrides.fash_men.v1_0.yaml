  - KIDS_HEIGHT_CM
normalization_rules:
- Keep raw size_text_raw for audit and matching
- Do not infer RU size from visual photo only
- For jeans, parse W/L separately if title contains Wxx Lxx
- If size is absent, keep size_label UNKNOWN_OR_NOT_PROVIDED in draft and ask user before publish
- For second-hand items, measurements are recommended but not required
measurement_widget:
  ui_group_code: measurements
  is_attribute: false
  expands_to_if_supported:
  - chest_cm
  - waist_cm
  - shoulder_cm
  - sleeve_cm
  - inseam_cm
  - total_length_cm
  fallback_behavior: show_as_optional_measurement_group_only_if_child_effective_spec_has_measurement_attributes
