negative_route_guards:
- pattern: женские кроссовки|женская обувь|женские ботинки|туфли женские|сапоги женские|балетки женские|лоферы женские
  target: FASH.SHOES
  severity: FORCE_OTHER_ROUTE
- pattern: женская сумка|женский рюкзак|клатч женский|шоппер женский
  target: FASH.BAGS
  severity: FORCE_OTHER_ROUTE
- pattern: женский ремень|женские часы|женский кошелек|украшения женские|сережки|колье|браслет|шапка женская|кепка женская|шарф
    женский
  target: FASH.ACCESSORIES
  severity: FORCE_OTHER_ROUTE
- pattern: женский парфюм|женская косметика|помада|тушь|шампунь женский|крем для лица
  target: BEAUTY
  severity: FORCE_OTHER_ROUTE
- pattern: детская|для девочки|девочке|подростковая для девочки|на девочку
  target: FASH.KIDS
  severity: ROUTE_OTHER_OR_AMBIGUOUS
- pattern: мужская|мужские|для мужчин|мужской
  target: FASH.MEN
  severity: ROUTE_OTHER_OR_AMBIGUOUS
ambiguity_policy:
  generic_type_without_gender: return_route_candidates_FASH.WOMEN_FASH.MEN_FASH.KIDS_or_common_context_not_final
  unisex_keyword: allow_FASH.WOMEN_if_listing_context_or_user_filter_is_women_else_UNISEX_candidate
  strong_female_default_type_without_gender: route_to_FASH.WOMEN_candidate_if_adult_context_and_no_kids_or_male_terms
  accessory_terms: always_guard_to_FASH.ACCESSORIES_unless apparel_type is BRA/TIGHTS/SOCKS/UNDERWEAR
