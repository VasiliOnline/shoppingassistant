  SPEAKER: [speaker_type, speaker_power_w, water_resistance, battery_life_hours]
  SMART_SPEAKER: [smart_assistant, streaming_protocols, wireless_standard]
  SOUNDBAR: [channel_config, subwoofer_included, surround_formats, input_type]
  MICROPHONE: [mic_type, recording_pattern, connector_type, phantom_power]
  AUDIO_INTERFACE: [input_type, output_type, phantom_power, sample_rate_khz, bit_depth]
  DAC_AMP: [input_type, output_type, sample_rate_khz, bit_depth, balanced_output]
  TURNTABLE: [turntable_drive_type, rpm_speed, cartridge_included, preamp_built_in]
  RECEIVER_AMPLIFIER: [receiver_channels, speaker_power_w, input_type, surround_formats]
