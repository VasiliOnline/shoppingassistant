version: 1.0
categoryCode: TECH.MONITORS_DISPLAYS
rules:
  - id: monitor_size_inches_pattern
    pattern: '(?i)\b(13\.3|14|15\.6|16|17\.3|21\.5|22|23\.8|24|25|27|28|29|30|31\.5|32|34|38|40|43|45|49|55)\s?("|дюйм|дюймов|inch|inches)\b'
    target_attribute: screen_size_in
    confidence: 0.95
  - id: refresh_rate_pattern
    pattern: '(?i)\b(60|75|100|120|144|165|170|180|200|240|280|300|360|500)\s?(hz|гц)\b'
    target_attribute: refresh_rate_hz
    confidence: 0.96
  - id: resolution_pattern
    pattern_map:
      '4k|uhd|3840x2160|2160p': 4K_UHD
      'qhd|2k|1440p|2560x1440': QHD
      'wqhd|3440x1440': WQHD
      'fhd|full hd|1080p|1920x1080': FHD
      '5k|5120x2880': 5K
      '6k|6016x3384': 6K
      '8k|7680x4320': 8K
    target_attribute: resolution_class
    confidence: 0.94
  - id: display_type_gaming_inference
    if_any_terms: ['игровой', 'gaming', 'g-sync', 'freesync', '144hz', '165hz', '240hz', '360hz']
    set:
      display_type: GAMING_MONITOR
    confidence: 0.82
  - id: display_type_professional_inference
    if_any_terms: ['proart', 'ultrasharp', 'eizo', 'color management', 'цветокоррекция', 'design monitor', 'дизайн']
    set:
      display_type: PROFESSIONAL_MONITOR
    confidence: 0.76
boundary:
  generated_rules_may_suggest_but_not_override_high_confidence_route_guard: true
