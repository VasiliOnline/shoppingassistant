version: 1.0
categoryCode: TECH.POWER_CHARGING_CABLES
rules:
  - NEW and OPEN_BOX allowed for all types.
  - USED allowed for chargers, cables, power banks, UPS, stations, surge protectors when safety condition is not suspicious.
  - FOR_PARTS allowed only when clearly marked and routed away from safety-critical publish flows.
  - Batteries with swelling/leakage/damage must be blocked by safety policy outside catalog taxonomy.
