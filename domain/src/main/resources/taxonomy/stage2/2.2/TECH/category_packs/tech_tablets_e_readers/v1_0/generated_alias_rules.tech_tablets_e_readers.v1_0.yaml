ruleset_id: generated_alias_rules.tech_tablets_e_readers.v1_0
categoryCode: TECH.TABLETS_E_READERS
generate:
- rule: brand_family_model_ru_en_permutations
  applies_to: tablet_model_head_seed.tech_tablets_e_readers.v1_0.tsv
  examples:
  - ipad pro 11
  - айпад про 11
  - galaxy tab s9
  - kindle paperwhite
- rule: storage_suffix_variants
  pattern: "{model} {storage_capacity_gb}gb|{model} {storage_capacity_gb} гб"
- rule: connectivity_suffix_variants
  pattern: "{model} wifi|{model} cellular|{model} lte|{model} 5g"
- rule: graphics_tablet_synonyms
  examples:
  - графический планшет {brand}
  - планшет для рисования {brand}
negative_generation_blocklist:
- игрушечный планшет
- таблетки
- ноутбук
- монитор
- смартфон
