policy_id: tablet_resale_condition_policy.tech_tablets_e_readers.v1_0
categoryCode: TECH.TABLETS_E_READERS
resale_required_disclosures:
- condition
- battery_health_percent_when_available
- repair_history_when_known
- original_box
- included_accessories
- charger_included
- stylus_included
- keyboard_included
special_notes:
- account lock / activation lock must be flagged if seller mentions it
- cracked screen must lower condition and add repair_history note
- FOR_PARTS listings should not appear as normal working devices without explicit badge
