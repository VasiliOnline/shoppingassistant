ruleset_id: vision_rules.tech_tablets_e_readers.v1_0
categoryCode: TECH.TABLETS_E_READERS
no_guess_policy:
  brand: require_logo_text_packaging_or_listing_text
  model: require_model_text_packaging_listing_or_serial_label
  storage_capacity_gb: require_listing_text_settings_screen_box_or_label
  cellular_generation: require_listing_text_model_variant_or_visible_slot_evidence
  compatibility: require_explicit_model_or_size_range_for_docks_and_stands
allowed_from_image_only:
- coarse tablet_type candidate
- visible screen/no-screen graphics tablet candidate
- e-reader candidate if e-ink display is visually obvious
- color_family candidate
- condition visual hints
forbidden_from_image_only:
- exact iPad generation
- exact Galaxy Tab generation
- storage capacity
- RAM
- cellular vs Wi-Fi if no text/model evidence
- compatibility model for dock/stand
fallback_behavior:
- emit model_name_text if text is present but normalization uncertain
- mark identity_resolution_status=NEEDS_REVIEW if model evidence is weak
- never reject listing solely because specs are missing
