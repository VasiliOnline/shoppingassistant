categoryCode: TECH.WEARABLES
publish_blockers:
  - missing_wearable_type
  - missing_condition
  - account_locked_or_unknown_for_high_value_watch_when_seller_claims_ready_to_use
  - ordinary_watch_routed_to_tech
strong_recommendations:
  - activation_lock_status for Apple Watch / LTE smartwatch
  - battery_health_or_battery_notes when seller provides it
  - original_box and included_accessories for high-value wearable devices
  - compatible model text for bands/chargers/protectors
privacy:
  - Never expose full IMEI or serial in public UI.
  - Store only redacted evidence/state when needed for moderation/trust.
