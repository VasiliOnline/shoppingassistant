surface_id: user_surface.tech_device_identity_common.v1_0
category_code: TECH.DEVICE_IDENTITY_COMMON
public_category: false
shared_standard: true
initial_fields_max: 8
initial_fields:
- brand
- family
- line
- model_name_text
- model
- region_variant
