org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# AGP + custom feature build dir (build/feature_alt) intermittently restores incomplete outputs from cache on Windows.
# Keep cache disabled to avoid missing generated artifacts (R.jar/BuildConfig/tmp kotlin classes) during lint/release builds.
org.gradle.caching=false
# Default the feature module to a separate build dir to avoid recurring Windows file locks in build/feature_alt.
featureBuildDirName=feature_alt_codex

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
