[versions]
gradle = "8.12"
agp = "8.12.3"
kotlin = "2.2.20"
compose-bom = "2024.10.01"
ktor = "3.0.0"
serialization = "1.7.3"
activity = "1.9.2"
navigation = "2.8.0"
coroutines = "1.9.0"
# генераторы кода подключим позже при необходимости
volley = "1.2.1"
room = "2.8.3"
ksp = "2.2.20-2.0.3"
room-common-jvm = "2.8.3" # если у тебя другая версия Kotlin — подставь совместимую ksp
lifecycle = "2.8.6"
benchmark-traceprocessor = "1.4.1"
play-services-analytics-impl = "18.2.0"
core-ktx = "1.17.0"
junit = "4.13.2"
junit-version = "1.3.0"
espresso-core = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
ink-brush = "1.0.0-beta02"
lottie = "6.4.0"
room-ktx = "2.8.4"
ui-graphics = "1.10.0"
material3 = "1.4.0"


[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }   # ← добавить
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library",     version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]

compose-bom     = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui      = { module = "androidx.compose.ui:ui" }
compose-m3      = { module = "androidx.compose.material3:material3" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
activity-compose   = { module = "androidx.activity:activity-compose", version.ref = "activity" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
ui = { group = "androidx.compose.ui", name = "ui" }

# Ktor client
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Kotlinx Serialization (если будешь работать с @Serializable напрямую)
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }
material3 = { group = "androidx.compose.material3", name = "material3" }
ui-text = { group = "androidx.compose.ui", name = "ui-text" }
foundation = { group = "androidx.compose.foundation", name = "foundation" }
animation-core = { group = "androidx.compose.animation", name = "animation-core" }
volley = { group = "com.android.volley", name = "volley", version.ref = "volley" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-common-jvm = { group = "androidx.room", name = "room-common-jvm", version.ref = "room-common-jvm" }

lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime-ktx  = { module = "androidx.lifecycle:lifecycle-runtime-ktx",  version.ref = "lifecycle" }
androidx-benchmark-traceprocessor = { group = "androidx.benchmark", name = "benchmark-traceprocessor", version.ref = "benchmark-traceprocessor" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-unit = { group = "androidx.compose.ui", name = "ui-unit" }
play-services-analytics-impl = { group = "com.google.android.gms", name = "play-services-analytics-impl", version.ref = "play-services-analytics-impl" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit-version" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-ink-brush = { group = "androidx.ink", name = "ink-brush", version.ref = "ink-brush" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottie" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room-ktx" }
androidx-compose-ui-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "ui-graphics" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
